
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5f3">
<title>零工小账本</title>
<style>
:root{--pink:#f5cbd2;--deep:#9b626d;--cream:#fffaf6;--ink:#51464a;--muted:#9c8e91;--green:#8cae98}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#fff2f1,#fffaf4 55%,#f8f1eb);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding:22px 15px 40px}
main{max-width:680px;margin:auto}
header{text-align:center;padding:18px 8px 22px}
.flower{font-size:25px;letter-spacing:8px;color:#d99ba7}
h1{font-size:27px;margin:10px 0 7px;color:#875c65}
.sub{font-size:13px;color:var(--muted)}
.card{background:rgba(255,255,255,.88);border:1px solid #f2e3e2;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 22px rgba(142,99,105,.06)}
.section-title{font-size:16px;font-weight:700;margin:0 0 15px;color:#805d65}
.month-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.month-row input{max-width:165px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px;border-radius:16px;background:#fff2f1}
.stat:nth-child(2){background:#f8f0e9}
.stat:nth-child(3){background:#eef5ef}
.stat:nth-child(4){background:#f2eff8}
.stat small{display:block;color:#927e83;font-size:12px;margin-bottom:7px}
.stat strong{font-size:21px;color:#805c65;overflow-wrap:anywhere}
.stat em{font-size:12px;font-style:normal;font-weight:400}
label{display:block;font-size:13px;color:#806e72;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid #eadcda;border-radius:12px;background:#fffdfb;padding:12px;font-size:15px;color:var(--ink);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:#d99ba7;box-shadow:0 0 0 3px #fbe9ec}
textarea{resize:vertical;min-height:65px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:13px;padding:12px 15px;font-size:14px;font-weight:600;cursor:pointer}
.primary{background:#d99ba7;color:white;width:100%;margin-top:17px}
.secondary{background:#f8eceb;color:#936873}
.danger{background:#fff0ed;color:#b56f68}
button:active{transform:scale(.98)}
.form-actions{display:flex;gap:9px}
.form-actions button{flex:1}
.entry{border:1px solid #f0e5e3;border-radius:16px;padding:14px;margin:10px 0;background:#fffdfb}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry-title{font-weight:700;font-size:15px}
.entry-date{font-size:12px;color:var(--muted);margin-top:5px}
.amount{font-size:19px;font-weight:700;color:#986773;white-space:nowrap}
.entry-meta{font-size:12px;color:#98888c;margin-top:9px;line-height:1.7;overflow-wrap:anywhere}
.status{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;margin-top:8px}
.paid{background:#edf5ee;color:#648b70}
.pending{background:#fff1e4;color:#b17d4d}
.entry-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.entry-actions button{padding:7px 11px;font-size:12px}
.empty{text-align:center;padding:25px 10px;color:#b2a2a5;font-size:13px}
.tools{display:flex;gap:9px;flex-wrap:wrap}
.tools button{flex:1;min-width:110px}
.hint{font-size:12px;color:#a39497;line-height:1.7;margin-top:12px}
.hidden{display:none!important}
footer{text-align:center;color:#b29da1;font-size:12px;padding:20px 0}
@media(max-width:380px){body{padding:15px 10px}.card{padding:14px}.stat strong{font-size:18px}}
</style>
</head>
<body>
<main>
<header>
 <div class="flower">✿ · ✿ · ✿</div>
 <h1>零工小账本</h1>
 <div class="sub">有活就记一笔，辛苦钱都好好收着。</div>
</header>

<section class="card">
 <div class="month-row">
  <div class="section-title" style="margin:0">本月小结</div>
  <input id="monthFilter" type="month">
 </div>
 <div class="stats">
  <div class="stat"><small>本月总收入</small><strong id="total">¥0.00</strong></div>
  <div class="stat"><small>已经到账</small><strong id="received">¥0.00</strong></div>
  <div class="stat"><small>还待收款</small><strong id="pending">¥0.00</strong></div>
  <div class="stat"><small>记了几笔</small><strong id="count">0 <em>笔</em></strong></div>
 </div>
</section>

<section class="card" id="formCard">
 <h2 class="section-title" id="formTitle">记下一笔</h2>
 <form id="entryForm">
  <input type="hidden" id="editId">
  <div class="row">
   <div><label for="date">日期</label><input id="date" type="date" required></div>
   <div><label for="amount">这一笔收入（元）</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="自己填写金额" required></div>
  </div>
  <label for="work">做的什么活（选填）</label>
  <input id="work" type="text" maxlength="60" placeholder="例如：套膜、打包、临时帮工……">
  <div class="row">
   <div><label for="quantity">数量（选填）</label><input id="quantity" type="number" min="0" step="any" inputmode="decimal" placeholder="例如：20"></div>
   <div><label for="unit">数量单位（选填）</label><input id="unit" type="text" maxlength="12" placeholder="把 / 件 / 次"></div>
  </div>
  <label for="note">备注（选填）</label>
  <textarea id="note" maxlength="300" placeholder="其他想记下的事情……"></textarea>
  <label for="status">收款情况</label>
  <select id="status"><option value="pending">待收款</option><option value="paid">已到账</option></select>
  <div class="form-actions">
   <button class="primary" type="submit" id="saveBtn">保存这一笔</button>
   <button class="secondary hidden" type="button" id="cancelEdit">取消修改</button>
  </div>
 </form>
</section>

<section class="card">
 <h2 class="section-title">收入明细</h2>
 <div id="entries"></div>
</section>

<section class="card">
 <h2 class="section-title">小账本备份</h2>
 <div class="tools">
  <button class="secondary" id="exportJson">导出备份</button>
  <button class="secondary" id="importBtn">导入备份</button>
  <button class="secondary" id="exportCsv">导出表格</button>
  <input class="hidden" id="fileInput" type="file" accept=".json,application/json">
 </div>
 <div class="hint">账本数据保存在当前浏览器里。换手机、换浏览器或清理浏览器数据前，记得先导出备份哦。</div>
</section>
<footer>愿每一份认真付出的劳动，都有好好收下的回报 ✿</footer>
</main>

<script>
(function(){
const KEY="an_lingong_ledger_v2";
const $=id=>document.getElementById(id);
let records=[];
let currentMonth="";
const today=()=>{
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const money=n=>"¥"+Number(n||0).toFixed(2);
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(){
 try{
  const v=JSON.parse(localStorage.getItem(KEY)||"[]");
  records=Array.isArray(v)?v:[];
 }catch(e){records=[];}
}
function save(){localStorage.setItem(KEY,JSON.stringify(records));}
function filtered(){return records.filter(x=>(x.date||"").slice(0,7)===currentMonth).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.created||0)-(a.created||0));}
function render(){
 const list=filtered();
 const total=list.reduce((s,x)=>s+Number(x.amount||0),0);
 const received=list.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0);
 $("total").textContent=money(total);
 $("received").textContent=money(received);
 $("pending").textContent=money(total-received);
 $("count").innerHTML=list.length+' <em>笔</em>';
 if(!list.length){$("entries").innerHTML='<div class="empty">这个月还没有记账记录。<br>有活就来记一笔吧。</div>';return;}
 $("entries").innerHTML=list.map(x=>{
  const title=x.work?escapeHtml(x.work):"一笔零工收入";
  const qty=x.quantity!==""&&x.quantity!=null?` · ${escapeHtml(x.quantity)} ${escapeHtml(x.unit||"")}`:"";
  const note=x.note?`<br>备注：${escapeHtml(x.note)}`:"";
  return `<article class="entry">
   <div class="entry-top"><div><div class="entry-title">${title}</div><div class="entry-date">${escapeHtml(x.date||"")}</div></div><div class="amount">${money(x.amount)}</div></div>
   <div class="entry-meta">${qty?`数量：${qty.slice(3)}`:""}${note}</div>
   <span class="status ${x.status==="paid"?"paid":"pending"}">${x.status==="paid"?"已到账":"待收款"}</span>
   <div class="entry-actions">
    <button class="secondary" data-action="toggle" data-id="${escapeHtml(x.id)}">${x.status==="paid"?"改为待收款":"标记已到账"}</button>
    <button class="secondary" data-action="edit" data-id="${escapeHtml(x.id)}">修改</button>
    <button class="danger" data-action="delete" data-id="${escapeHtml(x.id)}">删除</button>
   </div>
  </article>`;
 }).join("");
}
function resetForm(){
 $("entryForm").reset();$("date").value=today();$("editId").value="";
 $("formTitle").textContent="记下一笔";$("saveBtn").textContent="保存这一笔";
 $("cancelEdit").classList.add("hidden");
}
$("entryForm").addEventListener("submit",e=>{
 e.preventDefault();
 const amount=Number($("amount").value);
 if(!Number.isFinite(amount)||amount<0){alert("请填写正确的金额。");return;}
 const id=$("editId").value;
 const old=records.find(x=>x.id===id);
 const item={
  id:id||("lg_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)),
  date:$("date").value,amount,
  work:$("work").value.trim(),
  quantity:$("quantity").value,
  unit:$("unit").value.trim(),
  note:$("note").value.trim(),
  status:$("status").value,
  created:old?.created||Date.now()
 };
 if(id){records=records.map(x=>x.id===id?item:x);}
 else{records.push(item);}
 save();currentMonth=item.date.slice(0,7);$("monthFilter").value=currentMonth;
 resetForm();render();
});
$("entries").addEventListener("click",e=>{
 const b=e.target.closest("button[data-action]");if(!b)return;
 const x=records.find(r=>r.id===b.dataset.id);if(!x)return;
 const action=b.dataset.action;
 if(action==="toggle"){
  x.status=x.status==="paid"?"pending":"paid";save();render();
 }else if(action==="delete"){
  if(confirm("确定删除这笔记录吗？删除后无法自动恢复哦。")){
   records=records.filter(r=>r.id!==x.id);save();render();
  }
 }else if(action==="edit"){
  $("editId").value=x.id;$("date").value=x.date||today();
  $("amount").value=x.amount;$("work").value=x.work||"";
  $("quantity").value=x.quantity??"";$("unit").value=x.unit||"";
  $("note").value=x.note||"";$("status").value=x.status||"pending";
  $("formTitle").textContent="修改这一笔";$("saveBtn").textContent="保存修改";
  $("cancelEdit").classList.remove("hidden");
  $("formCard").scrollIntoView({behavior:"smooth",block:"start"});
 }
});
$("cancelEdit").addEventListener("click",resetForm);
$("monthFilter").addEventListener("change",()=>{
 currentMonth=$("monthFilter").value||today().slice(0,7);render();
});
function download(name,content,type){
 const blob=new Blob([content],{type});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;a.download=name;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
$("exportJson").addEventListener("click",()=>{
 download("零工小账本备份_"+today()+".json",JSON.stringify({version:2,records},null,2),"application/json;charset=utf-8");
});
$("importBtn").addEventListener("click",()=>$("fileInput").click());
$("fileInput").addEventListener("change",async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  const incoming=Array.isArray(data)?data:data.records;
  if(!Array.isArray(incoming))throw new Error("格式不正确");
  if(!confirm("导入会把备份记录合并到账本中，相同编号的记录会以备份为准。继续吗？"))return;
  const map=new Map(records.map(x=>[x.id,x]));
  incoming.forEach((x,i)=>{
   if(!x||typeof x!=="object"||!Number.isFinite(Number(x.amount)))return;
   const item={...x,id:String(x.id||("import_"+Date.now()+"_"+i)),amount:Number(x.amount)};
   map.set(item.id,item);
  });
  records=Array.from(map.values());save();render();alert("导入完成！");
 }catch(err){alert("导入失败，请确认选择的是本账本导出的 JSON 备份文件。");}
 finally{e.target.value="";}
});
$("exportCsv").addEventListener("click",()=>{
 const rows=[["日期","工作内容","金额（元）","数量","单位","收款情况","备注"]];
 records.slice().sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(x=>{
  rows.push([x.date||"",x.work||"",Number(x.amount||0),x.quantity||"",x.unit||"",x.status==="paid"?"已到账":"待收款",x.note||""]);
 });
 const csv="\uFEFF"+rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 download("零工小账本_"+today()+".csv",csv,"text/csv;charset=utf-8");
});
load();
currentMonth=today().slice(0,7);
$("monthFilter").value=currentMonth;
$("date").value=today();
render();
})();
</script>
</body>
</html>
