<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>零工记工本</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;max-width:680px;margin:auto;background:#f6f4fa;color:#302d3b;font:15px system-ui,sans-serif}
h2{margin:5px 0}
p{color:#777}
.card{background:white;padding:16px;border-radius:16px;margin:14px 0;box-shadow:0 2px 10px #00000008}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:#f0ebff;padding:12px 5px;border-radius:12px;text-align:center}
.stats small{color:#777;font-size:12px}
.stats b{display:block;font-size:17px;margin-top:6px;overflow-wrap:anywhere}
label{display:block;margin:12px 0 6px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;background:white;color:#302d3b}
textarea{min-height:65px}
button{padding:10px 13px;border:0;border-radius:10px;background:#eee;color:#333;font:inherit;margin:4px 3px 4px 0}
.primary{background:#6b55c8;color:white}
.danger{background:#ffeded;color:#a33}
.actions{display:flex;flex-wrap:wrap;gap:5px}
.actions button{flex:1}
.preview{margin-top:14px;padding:14px;background:#f0ebff;border-radius:12px}
.preview strong{display:block;font-size:25px;color:#624bb9;margin-top:5px}
.item{padding:14px 0;border-top:1px solid #eee}
.item:first-child{border-top:0}
.money{font-size:19px;font-weight:bold;margin:7px 0}
.muted{font-size:13px;color:#888}
.empty{text-align:center;padding:20px;color:#999}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.check label{margin:12px 0}
#file{display:none}
</style>
</head>
<body>

<h2>我的零工记工本</h2>
<p>套膜计件记录 · 每把 1.8 元</p>

<div class="card">
  <div class="stats">
    <div><small>本月应得</small><b id="total">¥0.00</b></div>
    <div><small>已到账</small><b id="received">¥0.00</b></div>
    <div><small>待收款</small><b id="pending">¥0.00</b></div>
  </div>
  <label>查看月份</label>
  <input type="month" id="month">
</div>

<div class="card">
  <h3 id="formTitle">记一笔套膜</h3>

  <form id="form">
    <label>工作日期</label>
    <input type="date" id="date" required>

    <label>今天做了多少把？</label>
    <input type="number" id="quantity" min="0" step="1"
      placeholder="输入今天完成的把数" required>

    <label>每把单价（元）</label>
    <input type="number" id="price" min="0" step="0.01"
      value="1.8" required>

    <div class="preview">
      <span class="muted">今天预计工资</span>
      <strong id="preview">¥0.00</strong>
    </div>

    <label>工作地点 / 名称</label>
    <input id="job" placeholder="例如：套膜">

    <div class="check">
      <input type="checkbox" id="paid">
      <label for="paid">这笔钱已经到账</label>
    </div>

    <label>备注</label>
    <textarea id="note" placeholder="选填"></textarea>

    <div class="actions">
      <button class="primary" type="submit" id="save">保存记录</button>
      <button type="button" id="cancel" hidden>取消编辑</button>
    </div>
  </form>
</div>

<div class="card">
  <h3>每天的记录</h3>
  <div class="actions">
    <button type="button" id="backup">备份数据</button>
    <button type="button" id="importBtn">导入备份</button>
    <button type="button" id="csv">导出表格</button>
    <input type="file" id="file" accept=".json,application/json">
  </div>
  <div id="records"></div>
</div>

<p class="muted">数据保存在当前浏览器中。记得定期备份哦。</p>

<script>
const $=id=>document.getElementById(id);
const KEY='lingong_jigongben_v1';
const PRICE_KEY='lingong_unit_price';

let data=[];
let editing=null;

try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'[]');
  if(Array.isArray(saved))data=saved;
}catch(e){
  data=[];
}

function today(){
  const d=new Date();
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

function money(n){
  return '¥'+Number(n||0).toLocaleString('zh-CN',{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function saveData(){
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
}

function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

$('date').value=today();
$('month').value=today().slice(0,7);
$('price').value=localStorage.getItem(PRICE_KEY)||'1.8';

function updatePreview(){
  const quantity=Number($('quantity').value)||0;
  const price=Number($('price').value)||0;
  $('preview').textContent=money(quantity*price);
}

$('quantity').addEventListener('input',updatePreview);
$('price').addEventListener('input',updatePreview);

function render(){
  const month=$('month').value;
  const rows=data.filter(x=>!month||String(x.date||'').startsWith(month));

  const total=rows.reduce((s,x)=>s+Number(x.pay||0),0);
  const received=rows.filter(x=>x.paid).reduce((s,x)=>s+Number(x.pay||0),0);

  $('total').textContent=money(total);
  $('received').textContent=money(received);
  $('pending').textContent=money(total-received);

  rows.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

  if(!rows.length){
    $('records').innerHTML='<div class="empty">这个月还没有记录。</div>';
    return;
  }

  $('records').innerHTML=rows.map(x=>{
    const hasQuantity=x.quantity!==undefined&&x.quantity!==null;
    const detail=hasQuantity
      ? `${escapeHTML(x.quantity)} 把 × ${money(x.price??x.unitPrice??1.8)}`
      : '历史记录';

    return `
      <div class="item">
        <b>${escapeHTML(x.date||'未填写日期')}</b>
        <span class="muted">${x.paid?' · 已到账':' · 待收款'}</span>
        <div class="money">${money(x.pay)}</div>
        <div>${detail}</div>
        <div>${escapeHTML(x.job||'')}</div>
        ${x.note||x.notes?`<div class="muted">${escapeHTML(x.note||x.notes)}</div>`:''}
        <div class="actions">
          <button data-edit="${escapeHTML(x.id)}">编辑</button>
          <button data-paid="${escapeHTML(x.id)}">${x.paid?'改为未到账':'标记已到账'}</button>
          <button class="danger" data-del="${escapeHTML(x.id)}">删除</button>
        </div>
      </div>
    `;
  }).join('');
}

$('month').addEventListener('change',render);

function resetForm(){
  editing=null;
  $('form').reset();
  $('date').value=today();
  $('price').value=localStorage.getItem(PRICE_KEY)||'1.8';
  $('formTitle').textContent='记一笔套膜';
  $('save').textContent='保存记录';
  $('cancel').hidden=true;
  updatePreview();
}

$('form').addEventListener('submit',e=>{
  e.preventDefault();

  const quantity=Number($('quantity').value);
  const price=Number($('price').value);

  if(!Number.isFinite(quantity)||quantity<0||
     !Number.isFinite(price)||price<0){
    alert('把数和单价请填写正确哦');
    return;
  }

  const item={
    id:editing||String(Date.now())+'-'+Math.random().toString(36).slice(2,7),
    date:$('date').value,
    quantity:quantity,
    price:price,
    pay:Math.round(quantity*price*100)/100,
    job:$('job').value.trim(),
    paid:$('paid').checked,
    note:$('note').value.trim()
  };

  if(editing){
    data=data.map(x=>String(x.id)===String(editing)?item:x);
  }else{
    data.push(item);
  }

  localStorage.setItem(PRICE_KEY,String(price));
  resetForm();
  saveData();
});

$('cancel').addEventListener('click',resetForm);

$('records').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;

  const id=b.dataset.edit??b.dataset.del??b.dataset.paid;
  const x=data.find(v=>String(v.id)===String(id));
  if(!x)return;

  if(b.dataset.edit!==undefined){
    editing=x.id;
    $('date').value=x.date||today();
    $('quantity').value=x.quantity??'';
    $('price').value=x.price??x.unitPrice??1.8;
    $('job').value=x.job||'';
    $('paid').checked=!!x.paid;
    $('note').value=x.note||x.notes||'';
    $('formTitle').textContent='编辑记录';
    $('save').textContent='保存修改';
    $('cancel').hidden=false;
    updatePreview();
    window.scrollTo(0,0);

  }else if(b.dataset.del!==undefined){
    if(confirm('确定删除这笔记录吗？')){
      data=data.filter(v=>String(v.id)!==String(id));
      saveData();
    }

  }else{
    x.paid=!x.paid;
    saveData();
  }
});

function download(filename,content,type){
  const url=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

$('backup').addEventListener('click',()=>{
  download(
    '零工记工本备份.json',
    JSON.stringify(data,null,2),
    'application/json'
  );
});

$('importBtn').addEventListener('click',()=>{
  $('file').click();
});

$('file').addEventListener('change',async()=>{
  const file=$('file').files[0];
  if(!file)return;

  try{
    const imported=JSON.parse(await file.text());
    if(!Array.isArray(imported))throw new Error();

    if(confirm('导入备份会替换当前记录，确定继续吗？')){
      data=imported;
      saveData();
      alert('备份导入成功！');
    }
  }catch(e){
    alert('文件格式不正确，无法导入。');
  }

  $('file').value='';
});

$('csv').addEventListener('click',()=>{
  const rows=[
    ['日期','把数','单价','工资','工作地点','到账状态','备注'],
    ...data.map(x=>[
      x.date||'',
      x.quantity??'',
      x.price??x.unitPrice??'',
      x.pay??0,
      x.job||'',
      x.paid?'已到账':'待收款',
      x.note||x.notes||''
    ])
  ];

  const csv='\uFEFF'+rows.map(row=>
    row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')
  ).join('\r\n');

  download('零工记工本.csv',csv,'text/csv;charset=utf-8');
});

render();
updatePreview();
</script>
</body>
</html>
